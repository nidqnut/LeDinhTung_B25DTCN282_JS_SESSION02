<body>
    <script>
  let numberOfBooks = Number(prompt("Nhập số lượng sách trong thư viện:"));
  if (numberOfBooks < 10) {
    console.log("Thư viện có ít sách");
  } else if (numberOfBooks <= 20) {
    console.log("Thư viện có số lượng sách vừa đủ");
  } else {
    console.log("Thư viện có nhiều sách");
  }
</script>
</body>
</html>
